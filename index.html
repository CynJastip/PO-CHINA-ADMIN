<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PO China Admin</title>
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#292725;--muted:#817a73;--accent:#7b8f73;--accent2:#e8eee4;--danger:#b85c5c;--warn:#b48745;--line:#e8e3dd;--shadow:0 10px 30px rgba(50,45,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:235px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}.brand{padding:6px 10px 25px}.brand b{font:700 22px Georgia,serif;letter-spacing:.5px}.brand small{display:block;color:var(--muted);margin-top:4px}.nav button{width:100%;text-align:left;padding:12px 13px;background:none;border-radius:12px;color:#625d58;margin:2px 0}.nav button.active,.nav button:hover{background:var(--accent2);color:#33412f;font-weight:600}.main{flex:1;padding:28px;max-width:1500px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:26px}.top p{margin:5px 0 0;color:var(--muted)}.btn{padding:11px 16px;border-radius:11px;background:var(--accent);color:#fff;font-weight:600}.btn.secondary{background:#f0ede9;color:#4d4843}.btn.danger{background:#f8e8e8;color:#963f3f}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:18px}.stat .label{color:var(--muted);font-size:12px}.stat strong{font-size:26px;display:block;margin-top:7px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}.red{background:var(--danger)}.yellow{background:var(--warn)}.section{margin-top:20px}.card{padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.search{flex:1;min-width:220px}.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.field:focus{border-color:#aebaa9}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formgrid.three{grid-template-columns:repeat(3,1fr)}label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.full{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:#eef2eb;color:#4f6549;font-size:12px;font-weight:600}.pill.warn{background:#fbf1df;color:#8b662d}.pill.red{background:#fae9e9;color:#964848}.actions{display:flex;gap:7px}.empty{padding:35px;text-align:center;color:var(--muted)}.itemrow{display:grid;grid-template-columns:1.1fr 1fr .7fr .7fr 1fr auto;gap:8px;align-items:end;margin-bottom:9px}.itemrow .field{min-width:0}.modal{position:fixed;inset:0;background:rgba(35,31,28,.38);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:23px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.close{background:#f2efeb;border-radius:50%;width:34px;height:34px}.notice{background:#f6f8f4;border:1px solid #e1e9dd;padding:12px;border-radius:12px;color:#566250;margin:12px 0}.right{text-align:right}.hide{display:none}.mobile-menu{display:none}.drawer-overlay{display:none}@media(max-width:900px){.side{width:76px;padding:15px 8px}.brand b{font-size:14px}.brand small,.nav span{display:none}.brand{text-align:center}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:18px}.formgrid,.formgrid.three{grid-template-columns:1fr}.itemrow{grid-template-columns:1fr 1fr 1fr}.itemrow .remove{grid-column:auto}.top h1{font-size:22px}}.mobileBack{display:none}@media(max-width:560px){.mobileBack{display:inline-block;margin-bottom:8px}.grid{grid-template-columns:1fr 1fr}.side{display:none}.main{padding:13px}.stat{padding:13px}.stat strong{font-size:21px}.top{align-items:flex-start}.top .btn{padding:9px 11px}}
@media(max-width:560px){.mobile-menu{display:flex;position:fixed;top:12px;left:12px;z-index:70;width:44px;height:44px;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgba(50,45,40,.12);font-size:24px;color:var(--ink)}.side{display:block;position:fixed;left:0;top:0;bottom:0;width:285px;height:100vh;z-index:60;transform:translateX(-105%);transition:transform .25s ease;box-shadow:10px 0 30px rgba(35,31,28,.12);padding:22px 14px}.side.open{transform:translateX(0)}.side .brand{text-align:left}.side .brand b{font-size:22px}.side .brand small,.side .nav span{display:block}.drawer-overlay.show{display:block;position:fixed;inset:0;z-index:55;background:rgba(35,31,28,.35)}.main{padding-top:70px}}
@media print{body{background:#fff}.side,.top,.no-print{display:none!important}.main{padding:0}.card,.stat{box-shadow:none;border:0}.print-area{display:block!important}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
 <div class="brand"><b>PO CHINA</b><small>Admin System</small></div>
 <div class="nav">
  <button class="active" onclick="page('dashboard')">🏠 <span>Dashboard</span></button>
  <button onclick="page('customers')">👤 <span>Customer</span></button>
  <button onclick="page('orders')">📦 <span>Order PO</span></button>
  <button onclick="page('payments')">💳 <span>Pembayaran</span></button>
  <button onclick="page('reports')">📊 <span>Laporan Supplier</span></button>
  <button onclick="page('batches')">🗂️ <span>Batch PO</span></button>
 </div>
 <div style="position:absolute;bottom:18px;left:18px;right:18px;color:var(--muted);font-size:11px">Data tersimpan di browser ini.</div>
</aside>
<button class="mobile-menu" onclick="toggleMenu()" aria-label="Menu">☰</button><div class="drawer-overlay" id="drawerOverlay" onclick="closeMenu()"></div>
<main class="main">
 <div id="app"></div>
</main>
</div>

<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>

<script>
const KEY='poChinaAdmin_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"customers":[],"orders":[],"payments":[],"batches":[],"settings":{"company":"PO CHINA ADMIN"}}');
if(!Array.isArray(db.batches))db.batches=[];
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function rupiah(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toggleMenu(){document.querySelector('.side')?.classList.toggle('open');document.getElementById('drawerOverlay')?.classList.toggle('show')}
function closeMenu(){document.querySelector('.side')?.classList.remove('open');document.getElementById('drawerOverlay')?.classList.remove('show')}
function page(p){closeMenu();document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active')); [...document.querySelectorAll('.nav button')].find(b=>b.getAttribute('onclick')?.includes("'"+p+"'"))?.classList.add('active'); ({dashboard,customers,orders,payments,reports,batches}[p])()}
function showModal(title,body){modal.classList.add('show');modalbox.innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="close" onclick="modal.classList.remove('show')">×</button></div>${body}`}
function customerName(id){return db.customers.find(c=>c.id===id)?.name||'—'}
function batchName(id){return db.batches.find(b=>b.id===id)?.name||'Tanpa Batch'}
function batchCount(id){return db.orders.filter(o=>o.batchId===id).length}
function batchOptions(selected=''){return db.batches.map(b=>`<option value="${b.id}" ${b.id===selected?'selected':''}>${esc(b.name)}</option>`).join('')}
function syncDpPayment(o){if(!o)return;let auto=db.payments.find(p=>p.orderId===o.id&&p.autoDp===true);let dp=Math.max(0,Number(o.dpAmount||0));if(dp>0){if(auto){auto.amount=dp;auto.date=auto.date||new Date().toISOString();auto.note='DP dari input order'}else{db.payments.push({id:crypto.randomUUID(),orderId:o.id,amount:dp,date:new Date().toISOString(),note:'DP dari input order',autoDp:true})}}else if(auto){db.payments=db.payments.filter(p=>p.id!==auto.id)}}
function syncAllDpPayments(){(db.orders||[]).forEach(syncDpPayment)}
syncAllDpPayments();
function paidFor(oid){return db.payments.filter(p=>p.orderId===oid).reduce((a,p)=>a+Number(p.amount||0),0)}
function orderTotals(o){let items=o.items||[];let base=items.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0);let adjustment=items.reduce((s,i)=>s+Number(i.price||0)*(Number(i.received??i.qty)-Number(i.qty)),0);let shipping=Number(o.shipping||0);return {base,adjustment,shipping,total:Math.max(0,base+adjustment+shipping)}}
function status(o){let t=orderTotals(o),p=paidFor(o.id);if(t.total===0)return ['Menunggu','warn'];if(p>=t.total)return ['Lunas',''];if(p>0)return ['DP','warn'];return ['Belum Bayar','red']}
function dashboard(){
 let total=db.orders.length, paid=0, dp=0, unpaid=0, ready=0, short=0;
 db.orders.forEach(o=>{let s=status(o)[0]; if(s==='Lunas')paid++; else if(s==='DP')dp++; else unpaid++; if(o.receivedSet)ready++; if((o.items||[]).some(i=>Number(i.received??i.qty)<Number(i.qty)))short++;});
 document.getElementById('app').innerHTML=`<div class="top"><div><h1>Dashboard 👋</h1><p>Ringkasan PO & pembayaran hari ini.</p></div><button class="btn" onclick="newOrder()">＋ Buat Order</button></div>
 <div class="grid">
  <div class="stat"><div class="label">Total Order</div><strong>${total}</strong></div>
  <div class="stat"><div class="label"><i class="dot"></i>Lunas</div><strong>${paid}</strong></div>
  <div class="stat"><div class="label"><i class="dot yellow"></i>DP</div><strong>${dp}</strong></div>
  <div class="stat"><div class="label"><i class="dot red"></i>Belum Bayar</div><strong>${unpaid}</strong></div>
 </div>
 <div class="section grid">
  <div class="stat"><div class="label">Customer</div><strong>${db.customers.length}</strong></div>
  <div class="stat"><div class="label">Barang Ready</div><strong>${ready}</strong></div>
  <div class="stat"><div class="label">Ada Kekurangan</div><strong>${short}</strong></div>
  <div class="stat"><div class="label">Total Nilai PO</div><strong>${rupiah(db.orders.reduce((s,o)=>s+orderTotals(o).total,0))}</strong></div>
 </div>
 <div class="section card"><h3 style="margin-top:0">Status Order Terbaru</h3><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Bayar</th><th>Status</th><th></th></tr></thead><tbody>
 ${db.orders.slice().reverse().slice(0,12).map(o=>{let t=orderTotals(o),s=status(o);return `<tr><td>${esc(o.invoice)}</td><td>${esc(customerName(o.customerId))}</td><td>${rupiah(t.total)}</td><td>${rupiah(paidFor(o.id))}</td><td><span class="pill ${s[1]}">${s[0]}</span></td><td><button class="btn secondary" onclick="editOrder('${o.id}')">Buka</button></td></tr>`}).join('')||`<tr><td colspan="6" class="empty">Belum ada order.</td></tr>`}
 </tbody></table></div></div>`;
}
function customers(){
 document.getElementById('app').innerHTML=`<div class="top"><div><button class="btn secondary mobileBack" onclick="page('dashboard')">← Dashboard</button><h1>Customer</h1><p>Simpan data customer sekali, pakai berkali-kali.</p></div><button class="btn" onclick="newCustomer()">＋ Customer</button></div>
 <div class="card"><div class="toolbar"><input class="field search" id="custSearch" placeholder="Cari nama / WhatsApp..." oninput="renderCust()"></div><div id="custTable"></div></div>`;renderCust();
}
function renderCust(){let q=(document.getElementById('custSearch')?.value||'').toLowerCase();let arr=db.customers.filter(c=>(c.name+c.wa+c.address).toLowerCase().includes(q));document.getElementById('custTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Nama</th><th>WhatsApp</th><th>Alamat</th><th>Order</th><th></th></tr></thead><tbody>${arr.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.wa)}</td><td style="white-space:normal;min-width:260px">${esc(c.address)}</td><td>${db.orders.filter(o=>o.customerId===c.id).length}</td><td><div class="actions"><button class="btn secondary" onclick="editCustomer('${c.id}')">Edit</button><button class="btn danger" onclick="delCustomer('${c.id}')">Hapus</button></div></td></tr>`).join('')||`<tr><td colspan="5" class="empty">Belum ada customer.</td></tr>`}</tbody></table></div>`}
function customerForm(c={}){showModal(c.id?'Edit Customer':'Customer Baru',`<div class="formgrid"><div><label>Nama</label><input class="field" id="f_name" value="${esc(c.name)}"></div><div><label>No. WhatsApp</label><input class="field" id="f_wa" value="${esc(c.wa)}"></div><div class="full"><label>Alamat Lengkap</label><textarea class="field" id="f_addr" rows="4">${esc(c.address)}</textarea></div></div><div class="right" style="margin-top:18px"><button class="btn" onclick="saveCustomer('${c.id||''}')">Simpan</button></div>`)}
let pendingOrder=false; function newCustomer(){customerForm()} function editCustomer(id){customerForm(db.customers.find(c=>c.id===id))}
function saveCustomer(id){let c={id:id||crypto.randomUUID(),name:f_name.value.trim(),wa:f_wa.value.trim(),address:f_addr.value.trim()};if(!c.name)return alert('Nama wajib diisi.');let i=db.customers.findIndex(x=>x.id===c.id);if(i<0)db.customers.push(c);else db.customers[i]=c;save();modal.classList.remove('show');if(pendingOrder){pendingOrder=false;orderForm();}else{customers()}}
function delCustomer(id){if(db.orders.some(o=>o.customerId===id))return alert('Customer masih punya order. Hapus order dulu jika memang diperlukan.');if(confirm('Hapus customer?')){db.customers=db.customers.filter(c=>c.id!==id);save();customers()}}
function orders(){
 document.getElementById('app').innerHTML=`<div class="top"><div><button class="btn secondary mobileBack" onclick="page('dashboard')">← Dashboard</button><h1>Order PO</h1><p>Semua pesanan customer, dipisahkan berdasarkan Batch.</p></div><button class="btn" onclick="newOrder()">＋ Buat Order</button></div>
 <div class="card"><div class="toolbar"><input class="field search" id="ordSearch" placeholder="Cari invoice / customer / kode..." oninput="renderOrders()"><select class="field" style="max-width:210px" id="ordBatch" onchange="renderOrders()"><option value="">Semua Batch</option>${batchOptions()}</select><select class="field" style="max-width:180px" id="ordStatus" onchange="renderOrders()"><option value="">Semua status</option><option>Lunas</option><option>DP</option><option>Belum Bayar</option></select></div><div id="ordTable"></div></div>`;renderOrders();
}
function renderOrders(){let q=(ordSearch?.value||'').toLowerCase(), st=ordStatus?.value||'', bt=ordBatch?.value||'';let arr=db.orders.filter(o=>{let s=status(o)[0];return(!st||s===st)&&(!bt||o.batchId===bt)&&(o.invoice+' '+customerName(o.customerId)+' '+batchName(o.batchId)+' '+(o.items||[]).map(i=>i.code).join(' ')).toLowerCase().includes(q)});ordTable.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Batch</th><th>Customer</th><th>Item</th><th>Total</th><th>Bayar</th><th>Status</th><th></th></tr></thead><tbody>${arr.slice().reverse().map(o=>{let t=orderTotals(o),s=status(o);return `<tr><td><b>${esc(o.invoice)}</b></td><td><span class="pill">${esc(batchName(o.batchId))}</span></td><td>${esc(customerName(o.customerId))}</td><td>${o.items.length} baris</td><td>${rupiah(t.total)}</td><td>${rupiah(paidFor(o.id))}</td><td><span class="pill ${s[1]}">${s[0]}</span></td><td><div class="actions"><button class="btn secondary" onclick="editOrder('${o.id}')">Buka</button><button class="btn secondary" onclick="printInvoice('${o.id}')">Invoice</button></div></td></tr>`}).join('')||`<tr><td colspan="8" class="empty">Belum ada order.</td></tr>`}</tbody></table></div>`}
function nextInvoice(){let d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),y=String(d.getFullYear()).slice(-2);let n=db.orders.length+1;return `INV/${m}${y}/${String(n).padStart(3,'0')}`}
function newOrder(){if(!db.customers.length){alert('Buat customer dulu.');pendingOrder=true;newCustomer();return}pendingOrder=false;orderForm()}
function editOrder(id){orderForm(db.orders.find(o=>o.id===id))}
function orderForm(o={}){let items=o.items||[{code:'',color:'',size:'',qty:1,price:0,received:1}];showModal(o.id?'Edit Order':'Buat Order',`
 <div class="formgrid"><div><label>Customer</label><select class="field" id="o_customer">${db.customers.map(c=>`<option value="${c.id}" ${c.id===o.customerId?'selected':''}>${esc(c.name)} — ${esc(c.wa)}</option>`).join('')}</select></div><div><label>Batch PO</label><select class="field" id="o_batch"><option value="">Tanpa Batch</option>${batchOptions(o.batchId||'')}</select></div><div class="full"><label>Invoice</label><input class="field" id="o_invoice" value="${esc(o.invoice||nextInvoice())}"></div></div>
 <div class="notice">Input barang manual. Harga diisi <b>harga jual customer</b>. Qty diterima bisa diubah nanti saat barang China datang.</div>
 <div id="items">${items.map(itemRow).join('')}</div>
 <button class="btn secondary" onclick="addItem()">＋ Tambah Barang</button>
 <div class="formgrid" style="margin-top:18px">
 <div><label>DP Customer</label><input class="field" id="o_dp" type="number" min="0" value="${o.dpAmount||0}" placeholder="Contoh: 500000"><small style="display:block;margin-top:6px;color:#777">Nominal DP yang diminta dari customer.</small></div>
 <div><label>Ongkir domestik (diisi saat ready)</label><input class="field" id="o_shipping" type="number" min="0" value="${o.shipping||0}"></div>
 <div class="full"><label>Catatan</label><textarea class="field" id="o_note" rows="3">${esc(o.note)}</textarea></div>
</div>
 <div class="right" style="margin-top:18px"><button class="btn" onclick="saveOrder('${o.id||''}')">Simpan Order</button></div>`) }
function itemRow(i){return `<div class="itemrow"><div><label>Kode</label><input class="field it_code" value="${esc(i.code)}"></div><div><label>Warna</label><input class="field it_color" value="${esc(i.color)}"></div><div><label>Size</label><input class="field it_size" value="${esc(i.size)}"></div><div><label>Qty</label><input class="field it_qty" type="number" min="1" value="${i.qty||1}"></div><div><label>Harga/pcs</label><input class="field it_price" type="number" min="0" value="${i.price||0}"></div><button class="btn danger remove" onclick="this.parentElement.remove()">×</button></div>`}
function addItem(){document.getElementById('items').insertAdjacentHTML('beforeend',itemRow({qty:1,price:0}))}
function saveOrder(id){let items=[...document.querySelectorAll('#items .itemrow')].map(r=>({code:r.querySelector('.it_code').value.trim(),color:r.querySelector('.it_color').value.trim(),size:r.querySelector('.it_size').value.trim(),qty:Number(r.querySelector('.it_qty').value||0),price:Number(r.querySelector('.it_price').value||0)})).filter(i=>i.code&&i.qty>0);if(!items.length)return alert('Minimal 1 barang.');let oldOrder=id?db.orders.find(x=>x.id===id):null;let o={id:id||crypto.randomUUID(),customerId:o_customer.value,batchId:o_batch.value||'',invoice:o_invoice.value.trim(),items,dpAmount:Number(o_dp.value||0),shipping:Number(o_shipping.value||0),note:o_note.value.trim(),receivedSet:oldOrder?oldOrder.receivedSet:false};let ix=db.orders.findIndex(x=>x.id===o.id);if(ix<0)db.orders.push(o);else{let old=db.orders[ix];o.items=o.items.map((ni,k)=>({...ni,received:(old.items[k]?.received??ni.qty)}));db.orders[ix]=o}syncDpPayment(o);save();modal.classList.remove('show');orders()}
function receiveOrder(id){let o=db.orders.find(x=>x.id===id);showModal('Barang Datang — '+o.invoice,`<div class="notice">Masukkan <b>Qty Diterima</b>. Jika supplier kurang kirim / tidak dapat, tagihan customer otomatis dipotong sesuai harga barang.</div><div id="recv">${o.items.map((i,k)=>`<div class="itemrow" style="grid-template-columns:1.5fr .7fr .7fr 1fr"><div><label>Barang</label><div style="padding:11px 0"><b>${esc(i.code)}</b> ${esc(i.color)} ${esc(i.size)}</div></div><div><label>Pesan</label><input class="field" value="${i.qty}" disabled></div><div><label>Diterima</label><input class="field recv" data-i="${k}" type="number" min="0" max="${i.qty}" value="${i.received??i.qty}"></div><div><label>Potongan</label><div style="padding:11px 0" id="disc${k}">${rupiah((i.qty-(i.received??i.qty))*i.price)}</div></div></div>`).join('')}</div><div class="right" style="margin-top:18px"><button class="btn" onclick="saveReceived('${id}')">Simpan & Potong Tagihan</button></div>`);document.querySelectorAll('.recv').forEach(x=>x.oninput=()=>{let k=x.dataset.i;let i=o.items[k];document.getElementById('disc'+k).textContent=rupiah((i.qty-Number(x.value||0))*i.price)})}
function saveReceived(id){let o=db.orders.find(x=>x.id===id);document.querySelectorAll('.recv').forEach(x=>o.items[x.dataset.i].received=Math.max(0,Math.min(o.items[x.dataset.i].qty,Number(x.value||0))));o.receivedSet=true;save();modal.classList.remove('show');editOrder(id)}
function addPayment(id){let o=db.orders.find(x=>x.id===id),t=orderTotals(o),p=paidFor(id);showModal('Tambah Pembayaran',`<div class="notice">Tagihan saat ini <b>${rupiah(t.total)}</b> · Sudah dibayar <b>${rupiah(p)}</b> · Sisa <b>${rupiah(Math.max(0,t.total-p))}</b></div><label>Nominal pembayaran</label><input class="field" id="payAmount" type="number" value="${Math.max(0,t.total-p)}"><label style="margin-top:10px">Catatan</label><input class="field" id="payNote" placeholder="DP / Pelunasan / Deposit"><div class="right" style="margin-top:18px"><button class="btn" onclick="savePayment('${id}')">Simpan Pembayaran</button></div>`)}
function savePayment(id){let a=Number(payAmount.value||0);if(a<=0)return alert('Nominal harus lebih dari 0.');db.payments.push({id:crypto.randomUUID(),orderId:id,amount:a,date:new Date().toISOString(),note:payNote.value});save();modal.classList.remove('show');editOrder(id)}
function editOrderView(o){return ''}
function orderDetail(id){return}
function payments(){document.getElementById('app').innerHTML=`<div class="top"><div><button class="btn secondary mobileBack" onclick="page('dashboard')">← Dashboard</button><h1>Pembayaran</h1><p>Kelola DP, pelunasan, dan riwayat pembayaran.</p></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Tagihan</th><th>Bayar</th><th>Sisa</th><th>Status</th><th></th></tr></thead><tbody>${db.orders.slice().reverse().map(o=>{let t=orderTotals(o),p=paidFor(o.id),s=status(o);return `<tr><td>${esc(o.invoice)}</td><td>${esc(customerName(o.customerId))}</td><td>${rupiah(t.total)}</td><td>${rupiah(p)}</td><td>${rupiah(Math.max(0,t.total-p))}</td><td><span class="pill ${s[1]}">${s[0]}</span></td><td><button class="btn secondary" onclick="addPayment('${o.id}')">＋ Bayar</button></td></tr>`}).join('')||`<tr><td colspan="7" class="empty">Belum ada order.</td></tr>`}</tbody></table></div></div>`}
function batches(){document.getElementById('app').innerHTML=`<div class="top"><div><button class="btn secondary mobileBack" onclick="page('dashboard')">← Dashboard</button><h1>Batch PO</h1><p>Pisahkan pesanan berdasarkan batch supaya order supplier tidak tercampur.</p></div><button class="btn" onclick="batchForm()">＋ Buat Batch</button></div><div class="card"><div id="batchTable"></div></div>`;renderBatches()}
function renderBatches(){let arr=db.batches.slice().reverse();document.getElementById('batchTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Batch</th><th>Tanggal</th><th>Order</th><th></th></tr></thead><tbody>${arr.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${esc(b.date||'—')}</td><td>${batchCount(b.id)} order</td><td><div class="actions"><button class="btn secondary" onclick="batchForm(db.batches.find(x=>x.id==='${b.id}'))">Edit</button><button class="btn danger" onclick="deleteBatch('${b.id}')">Hapus</button></div></td></tr>`).join('')||`<tr><td colspan="4" class="empty">Belum ada Batch. Buat batch pertama untuk memisahkan PO.</td></tr>`}</tbody></table></div>`}
function batchForm(b={}){showModal(b.id?'Edit Batch':'Buat Batch',`<div class="formgrid"><div class="full"><label>Nama Batch</label><input class="field" id="b_name" placeholder="Contoh: September 2026 #1" value="${esc(b.name)}"></div><div><label>Tanggal Batch</label><input class="field" id="b_date" type="date" value="${esc(b.date||new Date().toISOString().slice(0,10))}"></div></div><div class="right" style="margin-top:18px"><button class="btn" onclick="saveBatch('${b.id||''}')">Simpan Batch</button></div>`) }
function saveBatch(id){let name=document.getElementById('b_name').value.trim();if(!name)return alert('Nama batch wajib diisi.');let date=document.getElementById('b_date').value;let b={id:id||crypto.randomUUID(),name,date};let ix=db.batches.findIndex(x=>x.id===b.id);if(ix<0)db.batches.push(b);else db.batches[ix]=b;save();modal.classList.remove('show');batches()}
function deleteBatch(id){if(db.orders.some(o=>o.batchId===id))return alert('Batch ini masih dipakai oleh order. Pindahkan order ke batch lain dulu.');if(confirm('Hapus batch ini?')){db.batches=db.batches.filter(b=>b.id!==id);save();batches()}}
function reports(){document.getElementById('app').innerHTML=`<div class="top"><div><button class="btn secondary mobileBack" onclick="page('dashboard')">← Dashboard</button><h1>Laporan Supplier</h1><p>Rekap otomatis dari order customer, bisa dipisahkan per Batch.</p></div><div class="actions"><button class="btn secondary" onclick="exportCSV()">⬇ Export CSV</button><button class="btn" onclick="printReport()">🖨 Print</button></div></div><div class="card"><div class="toolbar"><select class="field" style="max-width:240px" id="reportBatch" onchange="renderReport()"><option value="">Semua Batch</option>${batchOptions()}</select></div><div class="notice">Jumlah di bawah ini adalah <b>Qty yang dipesan</b>. Pilih Batch untuk melihat PO supplier batch tersebut saja.</div><div id="reportTable"></div></div>`;renderReport()}
function renderReport(){let map={},bt=reportBatch?.value||'';db.orders.filter(o=>!bt||o.batchId===bt).forEach(o=>o.items.forEach(i=>{let k=[i.code,i.color,i.size].join('||');if(!map[k])map[k]={code:i.code,color:i.color,size:i.size,qty:0,received:0};map[k].qty+=i.qty;map[k].received+=Number(i.received??i.qty)}));let arr=Object.values(map).sort((a,b)=>a.code.localeCompare(b.code));reportTable.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Kode</th><th>Warna</th><th>Size</th><th>Qty Pesan</th><th>Qty Diterima</th><th>Kekurangan</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.color)}</td><td>${esc(x.size)}</td><td>${x.qty}</td><td>${x.received}</td><td>${Math.max(0,x.qty-x.received)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">Belum ada data.</td></tr>`}</tbody></table></div>`}
function exportCSV(){let rows=[['Batch','Kode','Warna','Size','Qty Pesan','Qty Diterima','Kekurangan']];let map={},bt=reportBatch?.value||'';db.orders.filter(o=>!bt||o.batchId===bt).forEach(o=>o.items.forEach(i=>{let k=[i.code,i.color,i.size].join('||');if(!map[k])map[k]={code:i.code,color:i.color,size:i.size,qty:0,received:0};map[k].qty+=i.qty;map[k].received+=Number(i.received??i.qty)}));Object.values(map).forEach(x=>rows.push([bt?batchName(bt):'Semua Batch',x.code,x.color,x.size,x.qty,x.received,Math.max(0,x.qty-x.received)]));let csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Laporan_Supplier.csv';a.click()}
function printReport(){let w=window.open('','_blank');let rows=document.getElementById('reportTable').innerHTML;w.document.write(`<html><head><title>Laporan Supplier</title><style>body{font:13px Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h2>Laporan Supplier</h2>${rows}</body></html>`);w.document.close();w.print()}
function printInvoice(id){let o=db.orders.find(x=>x.id===id),c=db.customers.find(x=>x.id===o.customerId),t=orderTotals(o),p=paidFor(id),s=t.total-p;let rows=o.items.map(i=>`<tr><td>${esc(i.code)}</td><td>${esc(i.color)}</td><td>${esc(i.size)}</td><td>${i.qty}</td><td>${rupiah(i.price)}</td><td>${rupiah(i.qty*i.price)}</td></tr>`).join('');let w=window.open('','_blank');w.document.write(`<html><head><title>${o.invoice}</title><style>body{font:13px Arial;color:#292725;padding:28px;max-width:850px;margin:auto}h1{font-family:Georgia;font-size:25px}.head{display:flex;justify-content:space-between}.box{background:#f1f5ef;padding:15px;border-radius:12px;margin:18px 0}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.total{margin-left:auto;width:300px}.row{display:flex;justify-content:space-between;padding:6px 0}.big{font-size:20px;font-weight:700}.green{color:#61755c}</style></head><body><div class="head"><div><h1>PO CHINA ADMIN</h1><div>Invoice ${esc(o.invoice)}</div></div><div style="text-align:right">${new Date().toLocaleDateString('id-ID')}</div></div><div class="box"><b>${esc(c.name)}</b><br>${esc(c.wa)}<br>${esc(c.address)}</div><table><thead><tr><th>Kode</th><th>Warna</th><th>Size</th><th>Qty</th><th>Harga</th><th>Subtotal</th></tr></thead><tbody>${rows}</tbody></table><div class="total"><div class="row"><span>Barang</span><b>${rupiah(t.base)}</b></div>${t.adjustment?`<div class="row"><span>Penyesuaian barang tidak didapat</span><b>${rupiah(t.adjustment)}</b></div>`:''}<div class="row"><span>Ongkir domestik</span><b>${rupiah(t.shipping)}</b></div><div class="row big"><span>Total</span><b>${rupiah(t.total)}</b></div><div class="row"><span>DP</span><b>${rupiah(o.dpAmount||0)}</b></div><div class="row"><span>Total sudah bayar</span><b>${rupiah(p)}</b></div><div class="row big green"><span>${s>0?'Sisa pembayaran':'Status'}</span><b>${s>0?rupiah(s):'LUNAS'}</b></div></div><p style="margin-top:35px">Catatan: ${esc(o.note||'Terima kasih.')}</p></body></html>`);w.document.close();w.print()}
function addressPrint(id){let o=db.orders.find(x=>x.id===id),c=db.customers.find(x=>x.id===o.customerId),w=window.open('','_blank');w.document.write(`<html><head><title>Alamat ${esc(c.name)}</title><style>@page{size:A6;margin:8mm}body{font:13px Arial;padding:10px}h1{font-size:20px}hr{border:0;border-top:1px dashed #999;margin:12px 0}.name{font-size:22px;font-weight:700}</style></head><body><h1>PO CHINA</h1><hr><div class="name">${esc(c.name)}</div><p><b>WhatsApp</b><br>${esc(c.wa)}</p><p><b>Alamat Lengkap</b><br>${esc(c.address).replace(/\n/g,'<br>')}</p><hr><b>${esc(o.invoice)}</b></body></html>`);w.document.close();w.print()}
function editOrder(id){let o=db.orders.find(x=>x.id===id),c=db.customers.find(x=>x.id===o.customerId),t=orderTotals(o),p=paidFor(id),s=t.total-p;showModal('Detail '+o.invoice,`<div class="notice"><b>${esc(c.name)}</b> · ${esc(c.wa)}<br>${esc(c.address)}<br><b>Batch:</b> ${esc(batchName(o.batchId))}</div><div class="tablewrap"><table><thead><tr><th>Kode</th><th>Warna</th><th>Size</th><th>Pesan</th><th>Diterima</th><th>Subtotal</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc(i.code)}</td><td>${esc(i.color)}</td><td>${esc(i.size)}</td><td>${i.qty}</td><td>${i.receivedSet?i.received??0:'—'}</td><td>${rupiah(i.qty*i.price)}</td></tr>`).join('')}</tbody></table></div><div class="notice"><b>Total tagihan: ${rupiah(t.total)}</b><br>DP diminta: ${rupiah(o.dpAmount||0)}<br>Sudah bayar: ${rupiah(p)}<br>Sisa: ${rupiah(Math.max(0,s))}</div><div class="actions"><button class="btn" onclick="receiveOrder('${id}')">📦 Barang Datang</button><button class="btn secondary" onclick="addPayment('${id}')">💳 Tambah Bayar</button><button class="btn secondary" onclick="printInvoice('${id}')">🧾 Invoice</button><button class="btn secondary" onclick="addressPrint('${id}')">🖨 Alamat</button><button class="btn secondary" onclick="orderForm(db.orders.find(x=>x.id==='${id}'))">✏️ Edit</button></div>`)}
page('dashboard');
</script>
</body>
</html>
